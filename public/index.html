<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f172a">
<title>حسابداری ساده</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>

<section id="login" class="screen hidden">
  <form class="card login-card" id="loginForm" autocomplete="on">
    <div class="logo">₮</div>
    <h1>حسابداری ساده</h1>
    <p class="muted">برای ادامه وارد شوید</p>
    <label>نام کاربری<input name="username" autocomplete="username" required dir="ltr"></label>
    <label>رمز عبور<input name="password" type="password" autocomplete="current-password" required dir="ltr"></label>
    <button class="btn primary big" type="submit">ورود</button>
    <div class="err" id="loginErr"></div>
  </form>
</section>

<div id="app" class="hidden">
  <header class="top">
    <div class="brand"><span class="logo sm">₮</span> حسابداری ساده</div>
    <nav id="tabs">
      <button data-tab="dash" class="active">داشبورد</button>
      <button data-tab="tx">تراکنش‌ها</button>
      <button data-tab="cats">دسته‌بندی‌ها</button>
      <button data-tab="users" data-role="owner">کاربران</button>
    </nav>
    <div class="me">
      <span id="meName"></span><span class="badge" id="meRole"></span>
      <button class="btn ghost sm" id="pwBtn" title="تغییر رمز">🔑</button>
      <button class="btn ghost sm" id="logoutBtn">خروج</button>
    </div>
  </header>

  <main>
    <section id="tab-dash" class="tab">
      <div class="toolbar">
        <div class="chips" id="range">
          <button data-r="month" class="active">این ماه</button>
          <button data-r="30">۳۰ روز اخیر</button>
          <button data-r="year">امسال</button>
          <button data-r="all">همه</button>
        </div>
        <button class="btn primary write-only" data-new>＋ ثبت تراکنش</button>
      </div>
      <div class="stats">
        <div class="card stat in"><span>مجموع ورودی</span><b id="sIn">0</b><small>تومان</small></div>
        <div class="card stat out"><span>مجموع خروجی</span><b id="sOut">0</b><small>تومان</small></div>
        <div class="card stat bal"><span>مانده</span><b id="sBal">0</b><small>تومان</small></div>
      </div>
      <div class="grid2">
        <div class="card"><h3>ورودی و خروجی (روزانه/ماهانه)</h3><div id="barChart" class="chart"></div></div>
        <div class="card"><h3>هزینه‌ها به تفکیک علت</h3><div id="donut" class="donut-wrap"></div></div>
      </div>
      <div class="card"><h3>آخرین تراکنش‌ها</h3><div id="recent"></div></div>
    </section>

    <section id="tab-tx" class="tab hidden">
      <div class="toolbar wrap">
        <input id="fq" placeholder="جستجو در طرف حساب / توضیحات / شماره سند">
        <select id="ftype"><option value="">همه</option><option value="income">ورودی</option><option value="expense">خروجی</option></select>
        <select id="fcat"><option value="">همه دسته‌ها</option></select>
        <label class="inl">از <span class="jdate" id="ffrom"></span></label>
        <label class="inl">تا <span class="jdate" id="fto"></span></label>
        <button class="btn ghost" id="fclear">پاک کردن</button>
        <a class="btn ghost" id="csv" href="#">⬇ خروجی اکسل</a>
        <button class="btn primary write-only" data-new>＋ ثبت</button>
      </div>
      <div class="card nopad"><div class="tablewrap"><table id="txTable"></table></div></div>
      <div class="pager"><button class="btn ghost sm" id="more" hidden>نمایش بیشتر</button><span class="muted" id="txInfo"></span></div>
    </section>

    <section id="tab-cats" class="tab hidden">
      <div class="grid2">
        <div class="card"><h3>علت‌های ورودی</h3><ul class="cats" id="catIn"></ul></div>
        <div class="card"><h3>علت‌های خروجی</h3><ul class="cats" id="catOut"></ul></div>
      </div>
      <form class="card write-only inline-form" id="catForm">
        <input name="name" placeholder="نام دسته جدید" required>
        <select name="type"><option value="income">ورودی</option><option value="expense">خروجی</option></select>
        <button class="btn primary">افزودن</button>
      </form>
    </section>

    <section id="tab-users" class="tab hidden">
      <div class="card nopad"><div class="tablewrap"><table id="userTable"></table></div></div>
      <form class="card inline-form" id="userForm">
        <input name="name" placeholder="نام نمایشی" required>
        <input name="username" placeholder="نام کاربری (انگلیسی)" dir="ltr" required>
        <input name="password" placeholder="رمز (حداقل ۶)" dir="ltr" required>
        <select name="role">
          <option value="accountant">حسابدار — ثبت و ویرایش</option>
          <option value="partner">شریک — فقط مشاهده</option>
          <option value="owner">مدیر — دسترسی کامل</option>
        </select>
        <button class="btn primary">افزودن کاربر</button>
      </form>
      <div class="card"><h3>گزارش فعالیت‌ها</h3><div id="auditList" class="audit"></div></div>
    </section>
  </main>
</div>

<div id="modal" class="modal hidden"><div class="sheet card" id="sheet"></div></div>
<div id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
